name: tests
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install -r requirements-prod.txt
      - run: python manage.py test --noinput
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: {POSTGRES_USER: paperlane, POSTGRES_PASSWORD: ci, POSTGRES_DB: paperlane}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U paperlane" --health-interval 5s --health-retries 10
    env:
      PAPERLANE_DATABASE_URL: postgres://paperlane:ci@localhost:5432/paperlane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements-prod.txt
      - run: python manage.py test --noinput
  browser:
    # Playwright 1.55 can't install Chromium on ubuntu-latest (26.04); keep the browser job on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test --noinput core.test_e2e
