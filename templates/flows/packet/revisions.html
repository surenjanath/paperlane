<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Step</th><th>Author</th><th>When</th><th>Note</th><th></th></tr></thead><tbody>
{% for r in revisions %}<tr><td>{{ r.number }}</td><td>{{ r.step_name|default:"—" }}</td><td>{{ r.author_label }}</td><td>{{ r.created_at|date:"M d, Y H:i" }}</td><td>{{ r.note }}</td>
<td class="num"><a class="btn btn-sm" href="{% url 'flows:packet_revision' packet.pk r.number %}">View</a> <a class="btn btn-sm" href="{% url 'flows:packet_download' packet.pk %}?revision={{ r.number }}">PDF</a></td></tr>
{% empty %}<tr><td colspan="6" class="muted">No revisions yet — revisions are created every time a recipient completes a step.</td></tr>{% endfor %}
</tbody></table></div>
