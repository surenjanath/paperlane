{% load ui %}
<div class="table-wrap"><table class="table"><thead><tr><th>File</th><th>Uploaded</th><th></th></tr></thead><tbody>
{% for f in files %}<tr><td>{{ f.original_name }}</td><td>{{ f.uploaded_at|date:"M d, Y H:i" }}</td><td class="num"><a class="btn btn-sm" href="{% url 'flows:download_file' f.pk %}">{% icon "download" %} Download</a></td></tr>
{% empty %}<tr><td colspan="3" class="muted">No uploaded files.</td></tr>{% endfor %}</tbody></table></div>
