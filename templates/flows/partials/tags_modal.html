<template id="tags-modal">
<form method="post">{% csrf_token %}
  <div class="modal-head"><h2>Tags</h2><button type="button" class="modal-close" data-close>×</button></div>
  <div class="modal-body"><div class="field"><label>Tags (comma separated)</label><input type="text" name="tags" placeholder="#Urgent, Finance"><div class="help">Tags help you find items faster. Leave empty to remove all tags.</div></div></div>
  <div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-dark">Save</button></div>
</form>
</template>
