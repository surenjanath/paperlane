<div class="sa-checks">
{% for c in checks %}<div class="sa-check {{ c.state }}"><span class="dot"></span><div class="grow"><b>{{ c.label }}</b><br><small class="muted">{{ c.detail }}</small></div>{% if c.link and c.state != 'ok' %}<a class="btn btn-sm" href="{{ c.link }}">Review</a>{% endif %}</div>{% endfor %}
</div>
